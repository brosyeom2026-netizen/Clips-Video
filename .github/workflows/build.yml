                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(0xFF64748B.toInt())
                  }
                  layout.addView(subtitle, wrapParams(bottomDp = 22))

                  // Step 1: Request ID Card
                  val reqCard = cardContainer()
                  reqCard.addView(stepBadge("STEP 1 · YOUR REQUEST ID"))
                  val reqHelp = TextView(this).apply {
                      text = "Send this Request ID to the app owner (YEOM BROS) to receive your Approval Code:"
                      textSize = 13f
                      setTextColor(0xFF475569.toInt())
                      setPadding(0, dp(6), 0, dp(10))
                  }
                  reqCard.addView(reqHelp, wrapParams())

                  val reqCodeDisplay = TextView(this).apply {
                      text = requestId
                      textSize = 22f
                      setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setTextColor(0xFF1E3A8A.toInt())

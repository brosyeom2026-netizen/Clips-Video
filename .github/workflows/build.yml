name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and configure project
        run: |
          if [ -f "ClipsVideo-Android-Project.zip" ]; then
            unzip -o ClipsVideo-Android-Project.zip
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*ClipsVideo*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
            elif [ ! -d "ClipsVideo" ]; then
              echo "Could not find ClipsVideo-Android-Project.zip or ClipsVideo directory"
              ls -la
              exit 1
            fi
          fi

          mkdir -p ClipsVideo/app/src/main/res/drawable
          mkdir -p ClipsVideo/app/src/main/res/mipmap-anydpi-v26
          mkdir -p ClipsVideo/app/src/main/java/com/clipsvideo/app

          cat << 'EOF' >> ClipsVideo/app/build.gradle.kts

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          # Adaptive Icon Background
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="18"
                          android:startY="12"
                          android:endX="92"
                          android:endY="96"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF1E40AF"/>
                          <item android:offset="0.55" android:color="#FF1D4ED8"/>
                          <item android:offset="1.0" android:color="#FF0F172A"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          # Adaptive Icon Foreground (Split Filmstrip + Scissors)
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"

                  }
                  reqCard.addView(reqCodeDisplay, wrapParams(bottomDp = 12))
                  reqCard.addView(secondaryButton("Copy Request ID") {
                      copyToClipboard("Request ID", requestId)
                  })
                  layout.addView(reqCard, wrapParams(bottomDp = 16))

                  // Step 2: Approval Code Input Card
                  val unlockCard = cardContainer()
                  unlockCard.addView(stepBadge("STEP 2 · ENTER APPROVAL CODE"))

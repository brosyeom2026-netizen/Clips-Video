              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt().coerceAtLeast(1)

              private fun roundedBox(
                  fillColor: Int,
                  radiusDp: Int,
                  strokeColor: Int = 0x00000000,
                  strokeWidthDp: Int = 0
              ): GradientDrawable = GradientDrawable().apply {
                  shape = GradientDrawable.RECTANGLE
                  cornerRadius = dp(radiusDp).toFloat()
                  setColor(fillColor)
                  if (strokeWidthDp > 0) {
                      setStroke(dp(strokeWidthDp), strokeColor)
                  }
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSeconds = (durationMs / 1000L).coerceAtLeast(0L)
                  val hours = totalSeconds / 3600L
                  val minutes = (totalSeconds % 3600L) / 60L
                  val seconds = totalSeconds % 60L
                  return if (hours > 0L) {
                      String.format(Locale.US, "%d:%02d:%02d", hours, minutes, seconds)
                  } else {
                      String.format(Locale.US, "%02d:%02d", minutes, seconds)
                  }
              }

              private fun formatShortDuration(ms: Long): String {
                  val totalSec = (ms / 1000.0).roundToInt().coerceAtLeast(1)
                  val mins = totalSec / 60
                  val secs = totalSec % 60
                  return when {
                      mins > 0 && secs == 0 -> "${mins}m"
                      mins > 0 -> "${mins}m${secs}s"
                      else -> "${secs}s"
                  }
              }

              private fun parseSegmentMs(): Long? {
                  val raw = durationInput.text.toString().trim().lowercase(Locale.US)
                  if (raw.isEmpty()) return null
                  return when {
                      raw.endsWith("s") -> {
                          val secs = raw.dropLast(1).trim().toLongOrNull() ?: return null
                          if (secs in 1..36000) secs * 1_000L else null
                      }
                      raw.endsWith("m") -> {
                          val mins = raw.dropLast(1).trim().toLongOrNull() ?: return null
                          if (mins in 1..600) mins * 60_000L else null
                      }
                      else -> {
                          val value = raw.toLongOrNull() ?: return null
                          if (isSecondsUnit) {
                              if (value in 1..36000) value * 1_000L else null
                          } else {
                              if (value in 1..600) value * 60_000L else null
                          }
                      }
                  }
              }

              private fun buildSplitBreakdown(totalMs: Long, segmentMs: Long): String {
                  if (totalMs <= segmentMs) {
                      return "1 clip (${formatShortDuration(totalMs)})"
                  }
                  val fullClips = (totalMs / segmentMs).toInt()
                  val remainderMs = totalMs % segmentMs
                  val minTailMs = min(1500L, segmentMs / 4L)
                  val hasRemainder = remainderMs >= minTailMs
                  val totalClips = if (hasRemainder) fullClips + 1 else fullClips

                  val parts = mutableListOf<String>()
                  val fullLabel = formatShortDuration(segmentMs)
                  if (fullClips <= 4) {
                      repeat(fullClips) { parts.add(fullLabel) }
                  } else {
                      parts.add("${fullClips}×${fullLabel}")
                  }
                  if (hasRemainder) {
                      parts.add(formatShortDuration(remainderMs))
                  }
                  return "$totalClips clips (${parts.joinToString(" + ")})"
              }

              private fun readVideoMetadata(uri: Uri): Pair<Long?, Int> {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      retriever.setDataSource(this, uri)
                      val duration = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull()
                      val rotation = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_ROTATION)?.toIntOrNull() ?: 0
                      Pair(duration, rotation)
                  } catch (_: Exception) {
                      Pair(null, 0)
                  } finally {
                      try { retriever.release() } catch (_: Exception) {}
                  }
              }

              private fun updateVideoTimeInfo() {
                  val durMs = selectedVideoDurationMs
                  if (durMs == null || durMs <= 0L) {
                      videoTimeLabel.text = "Length: --:--"
                      return
                  }
                  val segmentMs = parseSegmentMs()
                  val summary = if (segmentMs != null && segmentMs > 0L) {
                      "Length: ${formatDuration(durMs)}  ·  ${buildSplitBreakdown(durMs, segmentMs)}"
                  } else {
                      "Length: ${formatDuration(durMs)}"
                  }
                  videoTimeLabel.text = summary
              }


                  <path android:fillColor="#FF0F172A" android:pathData="M61.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M68.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M75.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M82.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M61.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M68.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M75.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M82.5,68.5h3.5v3.5h-3.5z"/>
                  <!-- Inner Frame & Play Triangle -->
                  <path android:fillColor="#330F172A" android:pathData="M60,43h25v22h-25z"/>
                  <path android:fillColor="#FFFFFFFF" android:pathData="M68,49l10,5l-10,5z"/>
              </group>

              <!-- Center Glowing Cut Line -->
              <path
                  android:strokeColor="#FFBAE6FD"
                  android:strokeWidth="1.6"
                  android:strokeLineCap="round"
                  android:pathData="M54,24v60"/>

              <!-- Center Scissors Blades -->
              <path
                  android:fillColor="#FFF8FAFC"
                  android:pathData="M46.5,35L59.5,61L56.5,62.5L44.5,38.5C44,37 45,35 46.5,35Z"/>
              <path
                  android:fillColor="#FFE2E8F0"
                  android:pathData="M61.5,35L48.5,61L51.5,62.5L63.5,38.5C64,37 63,35 61.5,35Z"/>

              <!-- Scissors Pivot Pin -->
              <path
                  android:fillColor="#FF38BDF8"
                  android:pathData="M54,51.5m-1.5,0a1.5,1.5 0 1,0 3,0a1.5,1.5 0 1,0 -3,0"/>

              <!-- Scissors Handles -->
              <path
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M48,66m-4.5,0a4.5,4.5 0 1,0 9,0a4.5,4.5 0 1,0 -9,0"/>
              <path
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M60,66m-4.5,0a4.5,4.5 0 1,0 9,0a4.5,4.5 0 1,0 -9,0"/>
          </vector>
          EOF

          # Standalone Composite Vector (used inside the in-app ImageView badge)
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_clips_logo_background"/>
              <item android:drawable="@drawable/ic_clips_logo_foreground"/>
          </layer-list>
          EOF

          # Adaptive Launcher Icon XML (Android 8.0+)
          cat << 'EOF' > ClipsVideo/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_clips_logo_background"/>
              <foreground android:drawable="@drawable/ic_clips_logo_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > ClipsVideo/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_clips_logo_background"/>
              <foreground android:drawable="@drawable/ic_clips_logo_foreground"/>
          </adaptive-icon>
          EOF

          # NoActionBar Light Theme removes the black top bar completely
          cat << 'EOF' > ClipsVideo/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Clips Video"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > ClipsVideo/app/src/main/java/com/clipsvideo/app/MainActivity.kt
          package com.clipsvideo.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMetadataRetriever
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.provider.Settings
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.*
          import androidx.documentfile.provider.DocumentFile
          import java.nio.ByteBuffer
          import java.security.MessageDigest
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.UUID
          import java.util.concurrent.Executors
          import kotlin.math.min
          import kotlin.math.roundToInt

          class MainActivity : Activity() {
              // CHANGE THIS SECRET SALT & ADMIN PIN BEFORE BUILDING IF DESIRED
              private val ADMIN_PIN = "2026"
              private val SECRET_SALT = "YEOM_BROS_CLIPS_VIDEO_2026_SECURE"

              private val prefsName = "clips_video_approval_prefs"
              private val keyApproved = "is_approved"
              private val keyRequestId = "device_request_id"

              private val pickVideo = 1001
              private val pickFolder = 1002
              private var videoUri: Uri? = null
              private var folderUri: Uri? = null
              private var selectedVideoDurationMs: Long? = null
              private var isSecondsUnit = false
              private var adminTapCount = 0
              private var lastAdminTapMs = 0L

              private lateinit var videoLabel: TextView
              private lateinit var videoTimeLabel: TextView
              private lateinit var folderLabel: TextView
              private lateinit var durationInput: EditText
              private lateinit var unitToggleButton: Button
              private lateinit var status: TextView
              private lateinit var splitButton: Button
              private val executor = Executors.newSingleThreadExecutor()
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  configureFullScreenEdgeToEdge()
                  try {
                      if (isAppApproved()) {
                          buildMainAppUi()
                      } else {
                          buildApprovalLockUi()
                      }
                  } catch (e: Exception) {
                      Toast.makeText(this, "UI error: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              @Suppress("DEPRECATION")
              private fun configureFullScreenEdgeToEdge() {
                  window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS)
                  window.clearFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.setSystemBarsAppearance(
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or
                              WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS,
                          WindowInsetsController.APPEARANCE_LIGHT_STATUS_BARS or
                              WindowInsetsController.APPEARANCE_LIGHT_NAVIGATION_BARS
                      )
                  } else {
                      var flags = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          flags = flags or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          flags = flags or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      }
                      window.decorView.systemUiVisibility = flags
                  }
              }

              private fun applySafeTopBottomPadding(targetLayout: LinearLayout) {
                  val baseSide = dp(20)
                  val baseTop = dp(24)
                  val baseBottom = dp(28)
                  targetLayout.setPadding(baseSide, baseTop + dp(24), baseSide, baseBottom)

                  targetLayout.setOnApplyWindowInsetsListener { v, insets ->
                      val topInset: Int
                      val bottomInset: Int
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          val sysBars = insets.getInsets(WindowInsets.Type.systemBars() or WindowInsets.Type.displayCutout())
                          topInset = sysBars.top
                          bottomInset = sysBars.bottom
                      } else {
                          @Suppress("DEPRECATION")
                          topInset = insets.systemWindowInsetTop
                          @Suppress("DEPRECATION")
                          bottomInset = insets.systemWindowInsetBottom
                      }
                      v.setPadding(
                          baseSide,
                          topInset + baseTop,
                          baseSide,
                          bottomInset + baseBottom
                      )
                      insets
                  }
                  targetLayout.requestApplyInsets()
              }

              private fun versionBadgeView(): TextView = TextView(this).apply {
                  text = "Pro Version 1.0.0"
                  textSize = 12f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(0xFF1D4ED8.toInt())
                  gravity = Gravity.CENTER
                  background = roundedBox(0xFFDBEAFE.toInt(), 99, 0xFF93C5FD.toInt(), 1)
                  setPadding(dp(12), dp(4), dp(12), dp(4))
              }

              private fun copyrightFooterView(): TextView = TextView(this).apply {
                  text = "Copyright by : YEOM BROS"
                  textSize = 12f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(0xFF475569.toInt())
                  gravity = Gravity.CENTER
                  setPadding(dp(8), dp(8), dp(8), dp(8))
                  setOnClickListener { handleCopyrightSecretTap() }
              }

              private fun isAppApproved(): Boolean {
                  val prefs = getSharedPreferences(prefsName, Context.MODE_PRIVATE)
                  return prefs.getBoolean(keyApproved, false)
              }

              private fun getOrCreateRequestId(): String {
                  val prefs = getSharedPreferences(prefsName, Context.MODE_PRIVATE)
                  val existing = prefs.getString(keyRequestId, null)
                  if (!existing.isNullOrBlank()) return existing

                  val androidId = try {
                      Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)
                  } catch (_: Exception) {
                      null
                  }
                  val seed = if (!androidId.isNullOrBlank()) androidId else UUID.randomUUID().toString()
                  val hash = sha256Hex("REQ:$seed").take(6).uppercase(Locale.US)
                  val reqId = "REQ-$hash"
                  prefs.edit().putString(keyRequestId, reqId).apply()
                  return reqId
              }

              private fun computeApprovalCode(requestId: String): String {
                  val normalized = requestId.trim().uppercase(Locale.US)
                  val digest = sha256Hex("$SECRET_SALT|$normalized")
                  return "KEY-${digest.take(8).uppercase(Locale.US)}"
              }

              private fun sha256Hex(input: String): String {
                  val bytes = MessageDigest.getInstance("SHA-256").digest(input.toByteArray(Charsets.UTF_8))
                  return bytes.joinToString("") { "%02x".format(it) }
              }

              private fun copyToClipboard(label: String, text: String) {
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  clipboard.setPrimaryClip(ClipData.newPlainText(label, text))
                  Toast.makeText(this, "$label copied!", Toast.LENGTH_SHORT).show()
              }

              private fun handleCopyrightSecretTap() {
                  val now = System.currentTimeMillis()
                  if (now - lastAdminTapMs > 2500L) {
                      adminTapCount = 0
                  }
                  lastAdminTapMs = now
                  adminTapCount++
                  if (adminTapCount >= 5) {
                      adminTapCount = 0
                      showAdminPinDialog()
                  }
              }

              private fun showAdminPinDialog() {
                  val pinInput = EditText(this).apply {
                      hint = "Enter Admin PIN"
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                  }
                  AlertDialog.Builder(this)
                      .setTitle("YEOM BROS · Admin Access")
                      .setMessage("Enter your Admin PIN to open the Approval Code Generator.")
                      .setView(pinInput)
                      .setPositiveButton("Unlock Admin") { _, _ ->
                          if (pinInput.text.toString().trim() == ADMIN_PIN) {
                              showAdminGeneratorDialog()
                          } else {
                              Toast.makeText(this, "Incorrect Admin PIN", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showAdminGeneratorDialog() {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(12), dp(20), dp(8))
                  }

                  val infoText = TextView(this).apply {
                      text = "Enter the user's Request ID (e.g., REQ-1A2B3C) to generate their Approval Code:"
                      textSize = 13f
                      setTextColor(0xFF475569.toInt())
                  }
                  container.addView(infoText, wrapParams(bottomDp = 10))

                  val reqInput = EditText(this).apply {
                      hint = "REQ-XXXXXX"
                      setText(getOrCreateRequestId())
                      isAllCaps = true
                      setSingleLine(true)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      background = roundedBox(0xFFF8FAFC.toInt(), 8, 0xFFCBD5E1.toInt(), 1)
                  }
                  container.addView(reqInput, wrapParams(bottomDp = 12))

                  val generatedCodeView = TextView(this).apply {
                      text = computeApprovalCode(reqInput.text.toString())
                      textSize = 18f
                      setTypeface(Typeface.MONOSPACE, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setTextColor(0xFF1E40AF.toInt())
                      background = roundedBox(0xFFEFF6FF.toInt(), 10, 0xFF93C5FD.toInt(), 1)
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                  }
                  container.addView(generatedCodeView, wrapParams(bottomDp = 10))

                  reqInput.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                          val text = s?.toString()?.trim().orEmpty()
                          generatedCodeView.text = if (text.isNotEmpty()) computeApprovalCode(text) else "KEY--------"
                      }
                      override fun afterTextChanged(s: Editable?) {}
                  })

                  val copyBtn = secondaryButton("Copy Approval Code") {
                      val code = generatedCodeView.text.toString()
                      copyToClipboard("Approval Code", code)
                  }
                  container.addView(copyBtn)

                  val builder = AlertDialog.Builder(this)
                      .setTitle("Admin Approval Generator")
                      .setView(container)
                      .setPositiveButton("Close", null)

                  if (!isAppApproved()) {
                      builder.setNeutralButton("Approve This Phone") { _, _ ->
                          getSharedPreferences(prefsName, Context.MODE_PRIVATE)
                              .edit()
                              .putBoolean(keyApproved, true)
                              .apply()
                          Toast.makeText(this, "Admin phone approved!", Toast.LENGTH_SHORT).show()
                          buildMainAppUi()
                      }
                  }

                  builder.show()
              }

              private fun buildApprovalLockUi() {
                  val requestId = getOrCreateRequestId()

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xFFF3F5FA.toInt())

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and configure project
        run: |
          if [ -f "ClipsVideo-Android-Project.zip" ]; then
            unzip -o ClipsVideo-Android-Project.zip
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*ClipsVideo*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
            elif [ ! -d "ClipsVideo" ]; then
              echo "Could not find ClipsVideo-Android-Project.zip or ClipsVideo directory"
              ls -la
              exit 1
            fi
          fi

          mkdir -p ClipsVideo/app/src/main/res/drawable
          mkdir -p ClipsVideo/app/src/main/res/mipmap-anydpi-v26
          mkdir -p ClipsVideo/app/src/main/java/com/clipsvideo/app

          cat << 'EOF' >> ClipsVideo/app/build.gradle.kts

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          # Adaptive Icon Background
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="18"
                          android:startY="12"
                          android:endX="92"
                          android:endY="96"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#FF1E40AF"/>
                          <item android:offset="0.55" android:color="#FF1D4ED8"/>
                          <item android:offset="1.0" android:color="#FF0F172A"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          # Adaptive Icon Foreground (Split Filmstrip + Scissors)
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Left Filmstrip Half (tilted) -->
              <group
                  android:pivotX="38"
                  android:pivotY="54"
                  android:rotation="-7">
                  <path android:pathData="M22,33h29v42h-29a4,4 0 0,1 -4,-4v-34a4,4 0 0,1 4,-4z">
                      <aapt:attr name="android:fillColor">
                          <gradient
                              android:startX="18"
                              android:startY="33"
                              android:endX="51"
                              android:endY="75"
                              android:type="linear">
                              <item android:offset="0.0" android:color="#FF38BDF8"/>
                              <item android:offset="1.0" android:color="#FF2563EB"/>
                          </gradient>
                      </aapt:attr>
                  </path>
                  <!-- Left Sprocket Holes -->
                  <path android:fillColor="#FF0F172A" android:pathData="M22,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M29,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M36,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M43,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M22,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M29,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M36,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M43,68.5h3.5v3.5h-3.5z"/>
                  <!-- Inner Frame & Play Triangle -->
                  <path android:fillColor="#330F172A" android:pathData="M23,43h25v22h-25z"/>
                  <path android:fillColor="#FFFFFFFF" android:pathData="M32,49l10,5l-10,5z"/>
              </group>

              <!-- Right Filmstrip Half (tilted) -->
              <group
                  android:pivotX="70"
                  android:pivotY="54"
                  android:rotation="7">
                  <path android:pathData="M57,33h29a4,4 0 0,1 4,4v34a4,4 0 0,1 -4,4h-29z">
                      <aapt:attr name="android:fillColor">
                          <gradient
                              android:startX="57"
                              android:startY="33"
                              android:endX="90"
                              android:endY="75"
                              android:type="linear">
                              <item android:offset="0.0" android:color="#FF60A5FA"/>
                              <item android:offset="1.0" android:color="#FF1D4ED8"/>
                          </gradient>
                      </aapt:attr>
                  </path>
                  <!-- Right Sprocket Holes -->
                  <path android:fillColor="#FF0F172A" android:pathData="M61.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M68.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M75.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M82.5,36h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M61.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M68.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M75.5,68.5h3.5v3.5h-3.5z"/>
                  <path android:fillColor="#FF0F172A" android:pathData="M82.5,68.5h3.5v3.5h-3.5z"/>
                  <!-- Inner Frame & Play Triangle -->
                  <path android:fillColor="#330F172A" android:pathData="M60,43h25v22h-25z"/>
                  <path android:fillColor="#FFFFFFFF" android:pathData="M68,49l10,5l-10,5z"/>
              </group>

              <!-- Center Glowing Cut Line -->
              <path
                  android:strokeColor="#FFBAE6FD"
                  android:strokeWidth="1.6"
                  android:strokeLineCap="round"
                  android:pathData="M54,24v60"/>

              <!-- Center Scissors Blades -->
              <path
                  android:fillColor="#FFF8FAFC"
                  android:pathData="M46.5,35L59.5,61L56.5,62.5L44.5,38.5C44,37 45,35 46.5,35Z"/>
              <path
                  android:fillColor="#FFE2E8F0"
                  android:pathData="M61.5,35L48.5,61L51.5,62.5L63.5,38.5C64,37 63,35 61.5,35Z"/>

              <!-- Scissors Pivot Pin -->
              <path
                  android:fillColor="#FF38BDF8"
                  android:pathData="M54,51.5m-1.5,0a1.5,1.5 0 1,0 3,0a1.5,1.5 0 1,0 -3,0"/>

              <!-- Scissors Handles -->
              <path
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M48,66m-4.5,0a4.5,4.5 0 1,0 9,0a4.5,4.5 0 1,0 -9,0"/>
              <path
                  android:strokeColor="#FFFFFFFF"
                  android:strokeWidth="3"
                  android:fillColor="#00000000"
                  android:pathData="M60,66m-4.5,0a4.5,4.5 0 1,0 9,0a4.5,4.5 0 1,0 -9,0"/>
          </vector>
          EOF

          # Standalone Composite Vector (used inside the in-app ImageView badge)
          cat << 'EOF' > ClipsVideo/app/src/main/res/drawable/ic_clips_logo.xml
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_clips_logo_background"/>
              <item android:drawable="@drawable/ic_clips_logo_foreground"/>
          </layer-list>
          EOF

          # Adaptive Launcher Icon XML (Android 8.0+)
          cat << 'EOF' > ClipsVideo/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_clips_logo_background"/>
              <foreground android:drawable="@drawable/ic_clips_logo_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > ClipsVideo/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_clips_logo_background"/>
              <foreground android:drawable="@drawable/ic_clips_logo_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > ClipsVideo/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Clips Video"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > ClipsVideo/app/src/main/java/com/clipsvideo/app/MainActivity.kt
          package com.clipsvideo.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMetadataRetriever
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.widget.*
          import androidx.documentfile.provider.DocumentFile
          import java.nio.ByteBuffer
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import kotlin.math.ceil
          import kotlin.math.min

          class MainActivity : Activity() {
              private val pickVideo = 1001
              private val pickFolder = 1002
              private var videoUri: Uri? = null
              private var folderUri: Uri? = null
              private var selectedVideoDurationMs: Long? = null
              private lateinit var videoLabel: TextView
              private lateinit var videoTimeLabel: TextView
              private lateinit var folderLabel: TextView
              private lateinit var durationInput: EditText
              private lateinit var status: TextView
              private lateinit var splitButton: Button
              private val executor = Executors.newSingleThreadExecutor()
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      buildUi()
                  } catch (e: Exception) {
                      Toast.makeText(this, "UI error: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt().coerceAtLeast(1)

              private fun roundedBox(
                  fillColor: Int,
                  radiusDp: Int,
                  strokeColor: Int = 0x00000000,
                  strokeWidthDp: Int = 0
              ): GradientDrawable = GradientDrawable().apply {
                  shape = GradientDrawable.RECTANGLE
                  cornerRadius = dp(radiusDp).toFloat()
                  setColor(fillColor)
                  if (strokeWidthDp > 0) {
                      setStroke(dp(strokeWidthDp), strokeColor)
                  }
              }

              private fun formatDuration(durationMs: Long): String {
                  val totalSeconds = (durationMs / 1000L).coerceAtLeast(0L)
                  val hours = totalSeconds / 3600L
                  val minutes = (totalSeconds % 3600L) / 60L
                  val seconds = totalSeconds % 60L
                  return if (hours > 0L) {
                      String.format(Locale.US, "%d:%02d:%02d", hours, minutes, seconds)
                  } else {
                      String.format(Locale.US, "%02d:%02d", minutes, seconds)
                  }
              }

              private fun readVideoMetadata(uri: Uri): Pair<Long?, Int> {
                  val retriever = MediaMetadataRetriever()
                  return try {
                      retriever.setDataSource(this, uri)
                      val duration = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull()
                      val rotation = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_ROTATION)?.toIntOrNull() ?: 0
                      Pair(duration, rotation)
                  } catch (_: Exception) {
                      Pair(null, 0)
                  } finally {
                      try { retriever.release() } catch (_: Exception) {}
                  }
              }

              private fun updateVideoTimeInfo() {
                  val durMs = selectedVideoDurationMs
                  if (durMs == null || durMs <= 0L) {
                      videoTimeLabel.text = "Length: --:--"
                      return
                  }
                  val minutes = durationInput.text.toString().toLongOrNull()
                  val summary = if (minutes != null && minutes in 1..600) {
                      val segmentMs = minutes * 60_000L
                      val estClips = ceil(durMs.toDouble() / segmentMs.toDouble()).toInt().coerceAtLeast(1)
                      "Length: ${formatDuration(durMs)}  ·  ~$estClips clip(s) at ${minutes}m"
                  } else {
                      "Length: ${formatDuration(durMs)}"
                  }
                  videoTimeLabel.text = summary
              }

              private fun buildUi() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(0xFFF3F5FA.toInt())
                      isFillViewport = true
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(44), dp(20), dp(32))
                  }

                  val badgeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  val iconPreview = ImageView(this).apply {
                      setImageResource(R.drawable.ic_clips_logo)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  badgeRow.addView(iconPreview, LinearLayout.LayoutParams(dp(64), dp(64)))
                  layout.addView(badgeRow, wrapParams(bottomDp = 10))

                  val title = TextView(this).apply {
                      text = "Clips Video"
                      textSize = 26f
                      setTextColor(0xFF0F172A.toInt())
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }
                  val subtitle = TextView(this).apply {
                      text = "Split long videos into smaller MP4 clips"
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setTextColor(0xFF64748B.toInt())
                  }
                  layout.addView(title, wrapParams(bottomDp = 4))
                  layout.addView(subtitle, wrapParams(bottomDp = 20))

                  val videoCard = cardContainer()
                  videoCard.addView(stepBadge("STEP 1 · SOURCE VIDEO"))
                  videoLabel = TextView(this).apply {
                      text = "No video selected"
                      textSize = 14f
                      setTextColor(0xFF475569.toInt())
                      setPadding(0, dp(6), 0, dp(4))
                  }
                  videoCard.addView(videoLabel, wrapParams())

                  videoTimeLabel = TextView(this).apply {
                      text = "Length: --:--"
                      textSize = 13f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFF1E40AF.toInt())
                      setPadding(0, 0, 0, dp(12))
                  }
                  videoCard.addView(videoTimeLabel, wrapParams())
                  videoCard.addView(secondaryButton("Choose Video") { openVideoPicker() })
                  layout.addView(videoCard, wrapParams(bottomDp = 14))

                  val folderCard = cardContainer()
                  folderCard.addView(stepBadge("STEP 2 · DESTINATION"))
                  folderLabel = TextView(this).apply {
                      text = "No save folder selected"
                      textSize = 14f
                      setTextColor(0xFF475569.toInt())
                      setPadding(0, dp(6), 0, dp(12))
                  }
                  folderCard.addView(folderLabel, wrapParams())
                  folderCard.addView(secondaryButton("Choose Save Folder") { openFolderPicker() })
                  layout.addView(folderCard, wrapParams(bottomDp = 14))

                  val lengthCard = cardContainer()
                  lengthCard.addView(stepBadge("STEP 3 · CLIP LENGTH (MINUTES)"))
                  durationInput = EditText(this).apply {
                      setText("15")
                      hint = "Enter minutes (1 - 600)"
                      textSize = 18f
                      setTextColor(0xFF0F172A.toInt())
                      setTypeface(null, Typeface.BOLD)
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setSingleLine(true)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = roundedBox(0xFFF8FAFC.toInt(), 10, 0xFFCBD5E1.toInt(), 1)
                      addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                              updateVideoTimeInfo()
                          }
                          override fun afterTextChanged(s: Editable?) {}
                      })
                  }
                  val inputParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      topMargin = dp(8)
                      bottomMargin = dp(10)
                  }
                  lengthCard.addView(durationInput, inputParams)

                  val presetRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  val presets = listOf(5, 10, 15, 30)
                  presets.forEachIndexed { index, mins ->
                      val chip = Button(this).apply {
                          text = "${mins}m"
                          textSize = 13f
                          isAllCaps = false
                          setTextColor(0xFF1E3A8A.toInt())
                          background = roundedBox(0xFFEFF6FF.toInt(), 8, 0xFFBFDBFE.toInt(), 1)
                          minimumHeight = 0
                          minHeight = 0
                          setPadding(dp(8), dp(8), dp(8), dp(8))
                          setOnClickListener {
                              durationInput.setText(mins.toString())
                              durationInput.setSelection(durationInput.text.length)
                              updateVideoTimeInfo()
                          }
                      }
                      val cp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          if (index < presets.lastIndex) rightMargin = dp(8)
                      }
                      presetRow.addView(chip, cp)
                  }
                  lengthCard.addView(presetRow, wrapParams())
                  layout.addView(lengthCard, wrapParams(bottomDp = 18))

                  splitButton = Button(this).apply {
                      text = "Split Video"
                      textSize = 16f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(0xFFFFFFFF.toInt())
                      background = roundedBox(0xFF2563EB.toInt(), 14)
                      setPadding(dp(16), dp(15), dp(16), dp(15))
                  }
                  splitButton.setOnClickListener { startSplit() }
                  layout.addView(splitButton, wrapParams(bottomDp = 14))

                  status = TextView(this).apply {
                      text = "Ready. Choose a video and a save folder to begin."
                      textSize = 14f
                      setTextColor(0xFF1E40AF.toInt())
                      background = roundedBox(0xFFEFF6FF.toInt(), 12, 0xFFBFDBFE.toInt(), 1)
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                  }
                  layout.addView(status, wrapParams(bottomDp = 14))

                  val foot = TextView(this).apply {
                      text = "Clips are exported sequentially in MP4 format. Video and audio streams are copied directly without re-encoding for fast export."
                      textSize = 12f
                      setTextColor(0xFF64748B.toInt())
                      gravity = Gravity.CENTER
                      setPadding(dp(8), 0, dp(8), 0)
                  }
                  layout.addView(foot, wrapParams())

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              private fun wrapParams(bottomDp: Int = 0) = LinearLayout.LayoutParams(
                  LinearLayout.LayoutParams.MATCH_PARENT,
                  LinearLayout.LayoutParams.WRAP_CONTENT
              ).apply {
                  bottomMargin = dp(bottomDp)
              }

              private fun cardContainer() = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  background = roundedBox(0xFFFFFFFF.toInt(), 16, 0xFFE2E8F0.toInt(), 1)
                  setPadding(dp(16), dp(14), dp(16), dp(16))
              }

              private fun stepBadge(label: String) = TextView(this).apply {
                  text = label
                  textSize = 11f
                  setTypeface(null, Typeface.BOLD)
                  letterSpacing = 0.06f
                  setTextColor(0xFF2563EB.toInt())
              }

              private fun secondaryButton(textValue: String, action: () -> Unit) = Button(this).apply {
                  text = textValue
                  textSize = 15f
                  isAllCaps = false
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(0xFF1E293B.toInt())
                  background = roundedBox(0xFFF1F5F9.toInt(), 12, 0xFFCBD5E1.toInt(), 1)
                  setPadding(dp(14), dp(12), dp(14), dp(12))
                  setOnClickListener { action() }
                  layoutParams = wrapParams()
              }

              private fun openVideoPicker() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(i, pickVideo)
              }

              private fun openFolderPicker() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(i, pickFolder)
              }

              @Deprecated("Use Activity Result APIs in a future update")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK || data?.data == null) return
                  val uri = data.data!!
                  val flags = data.flags and (Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                  try { contentResolver.takePersistableUriPermission(uri, flags) } catch (_: Exception) {}
                  if (requestCode == pickVideo) {
                      videoUri = uri
                      val displayName = DocumentFile.fromSingleUri(this, uri)?.name ?: uri.lastPathSegment ?: "Video selected"
                      videoLabel.text = displayName
                      videoLabel.setTextColor(0xFF0F172A.toInt())
                      videoLabel.setTypeface(null, Typeface.BOLD)
                      val (dur, _) = readVideoMetadata(uri)
                      selectedVideoDurationMs = dur
                      updateVideoTimeInfo()
                  } else if (requestCode == pickFolder) {
                      folderUri = uri
                      val folderName = DocumentFile.fromTreeUri(this, uri)?.name ?: "Selected folder"
                      folderLabel.text = "Folder: $folderName"
                      folderLabel.setTextColor(0xFF0F172A.toInt())
                      folderLabel.setTypeface(null, Typeface.BOLD)
                  }
              }

              private fun startSplit() {
                  val source = videoUri
                  val target = folderUri
                  val minutes = durationInput.text.toString().toLongOrNull()
                  if (source == null || target == null) {
                      status.text = "Please choose both a video and a save folder."
                      return
                  }
                  if (minutes == null || minutes !in 1..600) {
                      status.text = "Enter a clip length from 1 to 600 minutes."
                      return
                  }
                  splitButton.isEnabled = false
                  status.text = "Preparing video…"
                  executor.execute {
                      try {
                          val count = splitVideo(source, target, minutes * 60L * 1_000_000L)
                          handler.post { status.text = "Finished! Created $count clip(s)."; splitButton.isEnabled = true }
                      } catch (e: Exception) {
                          handler.post { status.text = "Could not split video: ${e.message ?: "Unsupported file"}"; splitButton.isEnabled = true }
                      }
                  }
              }

              private fun splitVideo(source: Uri, folder: Uri, segmentUs: Long): Int {
                  val (metaDurationMs, rotation) = readVideoMetadata(source)
                  val durationMs = selectedVideoDurationMs ?: metaDurationMs
                      ?: throw IllegalStateException("Cannot read video duration")
                  val totalUs = durationMs * 1000L
                  val directory = DocumentFile.fromTreeUri(this, folder) ?: throw IllegalStateException("Cannot open save folder")
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  var start = 0L
                  var part = 1
                  while (start < totalUs) {
                      val end = min(start + segmentUs, totalUs)
                      val out = directory.createFile("video/mp4", "ClipsVideo_${stamp}_%03d.mp4".format(Locale.US, part))
                          ?: throw IllegalStateException("Cannot create output file")
                      val actualEnd = writeSegment(source, out.uri, start, end, rotation)
                      handler.post { status.text = "Exported clip $part…" }
                      start = if (actualEnd > start) actualEnd else end
                      part++
                  }
                  return part - 1
              }

              private fun writeSegment(
                  source: Uri,
                  destination: Uri,
                  startUs: Long,
                  endUs: Long,
                  rotationDegrees: Int
              ): Long {
                  var inputPfd: ParcelFileDescriptor? = null
                  var outputPfd: ParcelFileDescriptor? = null
                  val extractor = MediaExtractor()
                  var muxer: MediaMuxer? = null
                  var lastWrittenUs = startUs
                  try {
                      inputPfd = contentResolver.openFileDescriptor(source, "r")
                          ?: throw IllegalStateException("Cannot open source video")
                      outputPfd = contentResolver.openFileDescriptor(destination, "w")
                          ?: throw IllegalStateException("Cannot create output video")

                      extractor.setDataSource(inputPfd.fileDescriptor)
                      muxer = MediaMuxer(outputPfd.fileDescriptor, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      muxer.setOrientationHint(rotationDegrees)

                      val trackMap = HashMap<Int, Int>()
                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("video/") || mime.startsWith("audio/")) {
                              extractor.selectTrack(i)
                              trackMap[i] = muxer.addTrack(format)
                          }
                      }
                      if (trackMap.isEmpty()) throw IllegalStateException("No supported audio/video tracks found")

                      muxer.start()
                      extractor.seekTo(startUs, MediaExtractor.SEEK_TO_CLOSEST_SYNC)
                      val firstSampleTime = extractor.sampleTime.coerceAtLeast(0L)
                      val buffer = ByteBuffer.allocate(8 * 1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()

                      while (true) {
                          val track = extractor.sampleTrackIndex
                          if (track < 0) break
                          val time = extractor.sampleTime
                          if (time >= endUs) {
                              lastWrittenUs = time
                              break
                          }
                          if (trackMap.containsKey(track)) {
                              buffer.clear()
                              val size = extractor.readSampleData(buffer, 0)
                              if (size < 0) break
                              bufferInfo.set(
                                  0,
                                  size,
                                  (time - firstSampleTime).coerceAtLeast(0L),
                                  extractor.sampleFlags
                              )
                              muxer.writeSampleData(trackMap[track]!!, buffer, bufferInfo)
                              lastWrittenUs = time
                          }
                          if (!extractor.advance()) break
                      }
                      muxer.stop()
                  } finally {
                      try { muxer?.release() } catch (_: Exception) {}
                      try { extractor.release() } catch (_: Exception) {}
                      try { inputPfd?.close() } catch (_: Exception) {}
                      try { outputPfd?.close() } catch (_: Exception) {}
                  }
                  return lastWrittenUs
              }

              override fun onDestroy() {
                  executor.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        working-directory: ClipsVideo
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipsVideo-debug-apk
          path: ClipsVideo/app/build/outputs/apk/debug/app-debug.apk

              @Deprecated("Use Activity Result APIs in a future update")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK || data?.data == null) return
                  val uri = data.data!!
                  val flags = data.flags and (Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                  try { contentResolver.takePersistableUriPermission(uri, flags) } catch (_: Exception) {}
                  if (requestCode == pickVideo) {
                      videoUri = uri
                      val displayName = DocumentFile.fromSingleUri(this, uri)?.name ?: uri.lastPathSegment ?: "Video selected"
                      videoLabel.text = displayName
                      videoLabel.setTextColor(0xFF0F172A.toInt())
                      videoLabel.setTypeface(null, Typeface.BOLD)
                      val (dur, _) = readVideoMetadata(uri)
                      selectedVideoDurationMs = dur
                      updateVideoTimeInfo()
                  } else if (requestCode == pickFolder) {
                      folderUri = uri
                      val folderName = DocumentFile.fromTreeUri(this, uri)?.name ?: "Selected folder"
                      folderLabel.text = "Folder: $folderName"
                      folderLabel.setTextColor(0xFF0F172A.toInt())
                      folderLabel.setTypeface(null, Typeface.BOLD)
                  }
              }

              private fun startSplit() {
                  val source = videoUri
                  val target = folderUri
                  val segmentMs = parseSegmentMs()
                  if (source == null || target == null) {
                      status.text = "Please choose both a video and a save folder."
                      return
                  }
                  if (segmentMs == null || segmentMs <= 0L) {
                      status.text = if (isSecondsUnit) {
                          "Enter a clip length from 1 to 36000 seconds."
                      } else {
                          "Enter a clip length from 1 to 600 minutes."
                      }
                      return
                  }
                  splitButton.isEnabled = false
                  status.text = "Preparing video…"
                  executor.execute {
                      try {
                          val exportedLabels = splitVideo(source, target, segmentMs * 1_000L)
                          val summary = if (exportedLabels.size <= 6) {
                              exportedLabels.joinToString(" + ")
                          } else {
                              "${exportedLabels.first()} … ${exportedLabels.last()}"
                          }
                          handler.post {
                              status.text = "Finished! Created ${exportedLabels.size} clip(s): $summary"
                              splitButton.isEnabled = true
                          }
                      } catch (e: Exception) {
                          handler.post {
                              status.text = "Could not split video: ${e.message ?: "Unsupported file"}"
                              splitButton.isEnabled = true
                          }
                      }
                  }
              }

              private fun splitVideo(source: Uri, folder: Uri, segmentUs: Long): List<String> {
                  val (metaDurationMs, rotation) = readVideoMetadata(source)
                  val durationMs = selectedVideoDurationMs ?: metaDurationMs
                      ?: throw IllegalStateException("Cannot read video duration")
                  val totalUs = durationMs * 1000L
                  val directory = DocumentFile.fromTreeUri(this, folder) ?: throw IllegalStateException("Cannot open save folder")
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

                  val exportedLabels = mutableListOf<String>()
                  var startUs = 0L
                  var part = 1
                  val minTailUs = min(1_500_000L, segmentUs / 4L)

                  while (startUs < totalUs) {
                      val remainingUs = totalUs - startUs
                      if (part > 1 && remainingUs < minTailUs) break

                      val targetEndUs = if (remainingUs - segmentUs < minTailUs) {
                          totalUs
                      } else {
                          min(startUs + segmentUs, totalUs)
                      }

                      val out = directory.createFile("video/mp4", "ClipsVideo_${stamp}_%03d.mp4".format(Locale.US, part))
                          ?: throw IllegalStateException("Cannot create output file")

                      val (nextStartUs, writtenDurationUs) = writeSegment(
                          source = source,
                          destination = out.uri,
                          startUs = startUs,
                          endUs = targetEndUs,
                          isLastClip = (targetEndUs >= totalUs),
                          rotationDegrees = rotation
                      )

                      val label = formatShortDuration(writtenDurationUs / 1000L)
                      exportedLabels.add(label)
                      handler.post { status.text = "Exported clip $part ($label)…" }

                      if (targetEndUs >= totalUs || nextStartUs <= startUs) break
                      startUs = nextStartUs
                      part++
                  }
                  return exportedLabels
              }

              private fun writeSegment(
                  source: Uri,
                  destination: Uri,
                  startUs: Long,
                  endUs: Long,
                  isLastClip: Boolean,
                  rotationDegrees: Int
              ): Pair<Long, Long> {
                  var inputPfd: ParcelFileDescriptor? = null
                  var outputPfd: ParcelFileDescriptor? = null
                  val extractor = MediaExtractor()
                  var muxer: MediaMuxer? = null
                  var nextClipStartUs = endUs
                  var maxPtsUs = 0L

                  try {
                      inputPfd = contentResolver.openFileDescriptor(source, "r")
                          ?: throw IllegalStateException("Cannot open source video")
                      outputPfd = contentResolver.openFileDescriptor(destination, "w")
                          ?: throw IllegalStateException("Cannot create output video")

                      extractor.setDataSource(inputPfd.fileDescriptor)
                      muxer = MediaMuxer(outputPfd.fileDescriptor, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      muxer.setOrientationHint(rotationDegrees)

                      var videoTrackIndex = -1
                      val allMediaTracks = mutableListOf<Int>()
                      val trackMap = HashMap<Int, Int>()

                      for (i in 0 until extractor.trackCount) {
                          val format = extractor.getTrackFormat(i)
                          val mime = format.getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("video/") || mime.startsWith("audio/")) {
                              allMediaTracks.add(i)
                              trackMap[i] = muxer.addTrack(format)
                              if (mime.startsWith("video/") && videoTrackIndex == -1) {
                                  videoTrackIndex = i
                              }
                          }
                      }
                      if (trackMap.isEmpty()) throw IllegalStateException("No supported audio/video tracks found")

                      val anchorUs: Long
                      if (videoTrackIndex != -1) {
                          extractor.selectTrack(videoTrackIndex)
                          extractor.seekTo(
                              startUs,
                              if (startUs == 0L) MediaExtractor.SEEK_TO_PREVIOUS_SYNC else MediaExtractor.SEEK_TO_CLOSEST_SYNC
                          )
                          anchorUs = extractor.sampleTime.coerceAtLeast(0L)
                          extractor.unselectTrack(videoTrackIndex)
                      } else {
                          extractor.selectTrack(allMediaTracks.first())
                          extractor.seekTo(startUs, MediaExtractor.SEEK_TO_CLOSEST_SYNC)
                          anchorUs = extractor.sampleTime.coerceAtLeast(0L)
                          extractor.unselectTrack(allMediaTracks.first())
                      }

                      for (trackIdx in allMediaTracks) {
                          extractor.selectTrack(trackIdx)
                      }
                      extractor.seekTo(anchorUs, MediaExtractor.SEEK_TO_PREVIOUS_SYNC)

                      muxer.start()
                      val buffer = ByteBuffer.allocate(8 * 1024 * 1024)
                      val bufferInfo = MediaCodec.BufferInfo()
                      var sawVideoKeyframe = (videoTrackIndex == -1)

                      while (true) {
                          val track = extractor.sampleTrackIndex
                          if (track < 0) break
                          val time = extractor.sampleTime
                          val flags = extractor.sampleFlags

                          if (time < anchorUs) {
                              if (!extractor.advance()) break
                              continue
                          }

                          if (!sawVideoKeyframe) {
                              if (track == videoTrackIndex && (flags and MediaCodec.BUFFER_FLAG_SYNC_FRAME) != 0) {
                                  sawVideoKeyframe = true
                              } else {
                                  if (!extractor.advance()) break
                                  continue
                              }
                          }

                          if (!isLastClip && time >= endUs) {
                              if (videoTrackIndex == -1 || (track == videoTrackIndex && (flags and MediaCodec.BUFFER_FLAG_SYNC_FRAME) != 0)) {
                                  nextClipStartUs = time
                                  break
                              }
                          }

                          if (trackMap.containsKey(track)) {
                              buffer.clear()
                              val size = extractor.readSampleData(buffer, 0)
                              if (size < 0) break
                              val relativePtsUs = (time - anchorUs).coerceAtLeast(0L)
                              if (relativePtsUs > maxPtsUs) {
                                  maxPtsUs = relativePtsUs
                              }
                              bufferInfo.set(0, size, relativePtsUs, flags)
                              muxer.writeSampleData(trackMap[track]!!, buffer, bufferInfo)
                          }
                          if (!extractor.advance()) break
                      }
                      muxer.stop()
                  } finally {
                      try { muxer?.release() } catch (_: Exception) {}
                      try { extractor.release() } catch (_: Exception) {}
                      try { inputPfd?.close() } catch (_: Exception) {}
                      try { outputPfd?.close() } catch (_: Exception) {}
                  }

                  val writtenDurationUs = if (maxPtsUs > 0L) maxPtsUs else (endUs - startUs).coerceAtLeast(0L)
                  return Pair(nextClipStartUs, writtenDurationUs)
              }

              override fun onDestroy() {
                  executor.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        working-directory: ClipsVideo
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipsVideo-debug-apk
          path: ClipsVideo/app/build/outputs/apk/debug/app-debug.apk
